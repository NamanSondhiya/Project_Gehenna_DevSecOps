apiVersion: apps/v1
kind: Deployment
metadata:
  name: gehenna-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: gehenna-backend
  template:
    metadata:
      labels:
        app: gehenna-backend
    spec:
      initContainers:
        - name: wait-for-mongo
          image: {{ .Values.mongoImage }}
          # env:
          #   - name: MONGO_INITDB_ROOT_USERNAME
          #     valueFrom:
          #       secretKeyRef:
          #         name: gehenna-secrets
          #         key: MONGO_USERNAME
          #   - name: MONGO_INITDB_ROOT_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: gehenna-secrets
          #         key: MONGO_PASSWORD

          command:
            - sh
            - -c
            - |
              until mongosh --host mongo \
                          --port 27017 \
                          --username "$MONGO_INITDB_ROOT_USERNAME" \
                          --password "$MONGO_INITDB_ROOT_PASSWORD" \
                          --authenticationDatabase admin \
                          --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                echo "waiting for mongo"
                sleep 3
              done
              echo "MongoDB is up!"
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gehenna-secrets
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gehenna-secrets
                  key: MONGO_PASSWORD
      containers:
        - name: gehenna-backend
          image: {{ .Values.backendImage }}
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: gehenna-config
                  key: BACKEND_PORT
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: gehenna-secrets
                  key: MONGO_URL
          # envFrom:
          # - configMapRef:
          #     name: gehenna-config
          # - secretRef:
          #     name: gehenna-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: gehenna-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: gehenna-backend
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
