apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: {{ .Values.namespace }}
  labels:
    name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: alibaba.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gehenna-frontend
                port:
                  number: 8001
